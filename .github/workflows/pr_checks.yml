name: "PR & Code Quality Checks"

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter Version
        run: flutter --version

      - name: Get Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none .
        continue-on-error: true

      - name: Run Static Code Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Unit & Widget Tests
        run: flutter test

  build-validation:
    name: Build Verification (Dev Flavor)
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Validate Dev APK Build
        run: |
          flutter build apk --flavor lnastaqim_dev -t lib/main_lnastaqim_dev.dart --no-tree-shake-icons

      - name: Upload Dev APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lnastaqim-dev-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
